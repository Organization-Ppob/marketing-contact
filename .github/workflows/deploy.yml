name: Deploy Prod Marketing Contact

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Marketing Contact (Prod)
    runs-on: [self-hosted]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
          echo "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" >> .env
          echo "AUTH_SECRET=${{ secrets.NEXTAUTH_URL }}" >> .env

      - name: Deploy Dashboard
        shell: bash
        run: |
          set -e

          echo "Workspace: $GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"

          echo "Listing files"
          ls -la

          echo "Stopping old container..."
          docker compose -f docker-compose.main.yml down || true

          echo "Building new image..."
          docker compose -f docker-compose.main.yml build --no-cache

          echo "Starting container..."
          docker compose -f docker-compose.main.yml up -d

          echo "Cleaning unused images..."
          docker image prune -f
